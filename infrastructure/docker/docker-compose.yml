version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: connect-africa-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-connect_africa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: connect-africa-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: connect-africa-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-connect_africa}
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

volumes:
  pgdata:
